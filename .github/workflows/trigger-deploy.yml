name: Notify Infra Project

on:
  push:
    branches: [ master ]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infra repo deployment
        run: |
          curl -X POST https://api.github.com/repos/EwenMi/DevOpsTraining/dispatches \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
          -d '{"event_type": "app_updated"}'
